name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # Runs internal/prices' TestRepoPricesJSONIsValid alongside everything
      # else. That test loads the real prices.json at the repo root (not a
      # fixture) and checks it has models, a resolvable reference_model, and
      # non-negative rates - the same invariants a dedicated Python step used
      # to check separately before the app was rewritten in Go.
      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check plugin
        run: node --check plugin/odometer.js
      # frontend/dist/main.js is hand-edited (no build/bundle step), so a
      # syntax slip has nothing else to catch it before it ships embedded in
      # the binary via //go:embed all:frontend/dist.
      - name: Syntax check frontend
        run: |
          node --check frontend/dist/main.js
          node --check frontend/dist/experience.js
          node --check frontend/dist/sessions.js
          node --check frontend/dist/budget-rules.js
          node --check plugin/event-diagnostics.js
      - name: Plugin regression tests
        run: node --test plugin/*.test.mjs

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no private data is tracked
        run: |
          set -e
          fail=0
          for f in odometer_state.json budget.json grace_claims.json prices.local.json metadata_settings.json model_metadata.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f must never be committed"
              fail=1
            fi
          done
          if git grep -qIE 'ses_[a-zA-Z0-9]{20}' -- . ':!*.md'; then
            echo "::error::possible session ids in tracked files"
            fail=1
          fi
          exit $fail
